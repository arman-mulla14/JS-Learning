        border: 1px solid rgb(234, 234, 76);
        width: 100%;
        height: auto;

        flex-wrap: wrap;

      }

      .store {
        /* slightly safer spacing and wrap for responsive buttons */
        margin-top: 20px;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
        border: 1px solid rgb(234, 234, 76);
        width: 100%;
        height: auto;
        min-height: 120px;
        border-radius: 12px;
        padding: 18px;

        flex-direction: row;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      /* NEW: improved button styles */
      .item-btn {
        background: linear-gradient(180deg, #f8fff8 0%, #e6ffea 100%);
        color: #054d18;
        border: 1px solid #bfe6c6;
        padding: 10px 16px;
        margin: 0;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        font-size: 15px;
        box-shadow: 0 6px 14px rgba(6, 60, 20, 0.06);
        transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms;
      }
      .bill {
        margin-top: 20px;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
        border: 1px solid rgb(234, 234, 76);
        width: 100%;
        height: auto;
        min-height: 120px;
        border-radius: 12px;
        padding: 18px;
        text-align: center;
        display: flex;
        flex-direction: row;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
      }
      .item-btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 14px 28px rgba(6, 60, 20, 0.1);
        filter: brightness(1.02);
      }

      .item-btn:active {
        transform: translateY(-1px) scale(0.995);
        box-shadow: 0 6px 14px rgba(6, 60, 20, 0.08);
      }

      .item-btn:focus {
        outline: none;
        box-shadow: 0 0 0 4px rgba(34, 139, 34, 0.12);
      }

        background: #2fb58d;
        width: 160px;
        height: 50px;
        font-size: 20px;
        font-family: Arial, Helvetica, sans-serif;
